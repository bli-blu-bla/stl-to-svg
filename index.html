<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>STL to SVG Converter</title>
    <meta name="description" content="Convert 3D STL files to 2D SVG paths for laser cutting, CNC routing, and fabrication." />
    <script>
      // Apply a saved theme before the first paint so the page never flashes.
      try {
        var t = localStorage.getItem('stl-to-svg:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* storage blocked — follow the system */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
